<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Grolo</title>
    <script>
      // GitHub Pages serves this file for any path that doesn't map to a
      // real file. Save the requested path, then walk up one directory at
      // a time until the site root serves index.html, where the stored
      // path is restored for React Router. The path is only stored once
      // so nested redirects don't overwrite the original URL.
      if (!sessionStorage.getItem("redirect")) {
        sessionStorage.setItem("redirect", location.pathname + location.search + location.hash);
      }
      var path = location.pathname.replace(/\/+$/, "");
      var parent = path.replace(/\/[^/]*$/, "/");
      location.replace(parent || "/");
    </script>
  </head>
  <body></body>
</html>
